services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - ./data:/app/data
    command: python -m uvicorn truthlens.api:app --host 0.0.0.0 --port 8000

  ui:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    command: streamlit run app.py --server.address 0.0.0.0 --server.port 8501
